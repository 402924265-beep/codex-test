<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>if(new URLSearchParams(location.search).get("embedded")==="1")document.documentElement.classList.add("embedded");</script>
  <title>DW Rolling Forecast</title>
  <link rel="stylesheet" href="./src/erpnext-budget-demo.css?v=20260902-variance-split-v1" />
</head>
<body>
  <!--
    THESIS: A factory SPC control room for cost variance; it refuses the equal-weight KPI card wall that hides what changed.
    OWN-WORLD: Pale engineering-grid ground, deep petrol navigation, enamel-white work surfaces, teal favorable states, brick adverse states, ochre pending states.
    STORY: Cost owners review the rolling forecast first, then compare actuals with both rolling versions and the administration forecast on one variance page.
    FIRST VIEWPORT: A compact rolling forecast ledger; the variance page groups 3+9 through 6+6 realization and the annual administration-forecast comparison.
    FORM: SPC anomaly-control room, grounded candidate 1 and user-selected Impeccable pick, seed 3c71c9e3.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="shell">
    <aside class="rail" aria-label="Navigation">
      <div class="brand-mark" aria-hidden="true">DW</div>
      <nav id="railNav" aria-label="Model navigation"></nav>
      <a id="backLink" href="./index.html"></a>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="pageTitle"></h1>
          <p id="pageSubtitle" class="sr-only"></p>
        </div>
        <div class="top-actions">
          <label><span id="languageLabel" class="sr-only"></span><select id="languageSelect"><option value="zh">中文</option><option value="en">English</option><option value="tr">Türkçe</option></select></label>
          <label><span id="versionLabel" class="sr-only"></span><select id="versionSelect"><option value="r2">2026 Administration Forecast</option><option value="forecast" selected>2026 Aug Rolling Forecast</option></select></label>
          <span id="versionStatus" class="status"></span>
        </div>
      </header>

      <section id="contextBar" class="context-bar"></section>
      <section id="actualVarianceMatrix" class="actual-variance-stage" aria-label="Rolling forecast realization variance"></section>
      <section id="summaryCards" class="summary-grid" aria-label="Budget summary"></section>
      <nav id="viewTabs" class="tabs" aria-label="Budget model pages"></nav>
      <section id="modelView"></section>
    </main>
  </div>
  <div id="varianceHover" class="variance-hover" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/erpnext-budget-demo.js?v=20260902-variance-split-v1"></script>
</body>
</html>
